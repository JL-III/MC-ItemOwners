# Please don't change this
version: 1

# Items that can be owned
items: [
    'DIAMOND_PICKAXE', 'DIAMOND_SHOVEL', 'DIAMOND_HOE', 'DIAMOND_SWORD', 'DIAMOND_AXE',
    'DIAMOND_BOOTS', 'DIAMOND_LEGGINGS', 'DIAMOND_CHESTPLATE', 'DIAMOND_HELMET',
    'NETHERITE_PICKAXE', 'NETHERITE_SHOVEL', 'NETHERITE_HOE', 'NETHERITE_SWORD', 'NETHERITE_AXE',
    'NETHERITE_BOOTS', 'NETHERITE_LEGGINGS', 'NETHERITE_CHESTPLATE', 'NETHERITE_HELMET',
    'ELYTRA', 'BOW', 'CROSSBOW', 'FISHING_ROD', 'TRIDENT'
]

# How long detailed item history should be stored. The newest event for each item is always retained.
retention-period: 14

# Worlds that players can not own items on
disabled-worlds: ['example-world']

# If you use clear inventory confirmation, set this to true
clear-inventory-confirmation: false

# Paid recovery is available only for confirmed despawns recorded after this feature is installed.
recovery:
  enabled: true

  # Flat amount withdrawn through Vault when an item is recovered.
  fee: 1000.0

  # Set to 0 for no expiry. This should normally be no longer than your event retention period.
  max-age-days: 14
